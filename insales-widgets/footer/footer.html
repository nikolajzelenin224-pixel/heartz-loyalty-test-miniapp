<script>
(function () {
  var ENDPOINT = 'https://heartz.immo/ajax/hz-newsletter-subscribe.php';
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var MESSAGES = {
    empty: 'ВВЕДИТЕ E-MAIL',
    invalid: 'ПРОВЕРЬТЕ ПРАВИЛЬНОСТЬ E-MAIL',
    confirm: 'ПОЧТИ ГОТОВО! ПОДТВЕРДИТЕ ПОДПИСКУ В ПИСЬМЕ НА ПОЧТЕ',
    subscribed: 'СПАСИБО! ВЫ ПОДПИСАНЫ НА НОВОСТИ HEARTZ',
    already: 'ЭТОТ E-MAIL УЖЕ ПОДПИСАН',
    limit: 'СЛИШКОМ МНОГО ПОПЫТОК, ПОПРОБУЙТЕ ПОЗЖЕ',
    error: 'НЕ ПОЛУЧИЛОСЬ ПОДПИСАТЬСЯ, ПОПРОБУЙТЕ ЕЩЁ РАЗ'
  };

  function init(form) {
    if (form.getAttribute('data-hz-ready')) return;
    form.setAttribute('data-hz-ready', '1');

    var input = form.querySelector('.hz-newsletter__input');
    var honeypot = form.querySelector('.hz-newsletter__hp');
    var button = form.querySelector('.hz-newsletter__submit');
    var status = form.querySelector('.hz-newsletter__status');
    var busy = false;

    function show(text, type) {
      status.textContent = text;
      status.className = 'hz-newsletter__status' + (type ? ' is-' + type : '');
      form.classList.toggle('has-error', type === 'error');
    }

    input.addEventListener('input', function () {
      if (form.classList.contains('has-error')) show('', '');
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy) return;

      var email = String(input.value || '').trim();
      if (!email) { show(MESSAGES.empty, 'error'); input.focus(); return; }
      if (email.length > 254 || !EMAIL_RE.test(email)) { show(MESSAGES.invalid, 'error'); input.focus(); return; }

      busy = true;
      button.disabled = true;
      form.classList.add('is-loading');
      show('', '');

      var controller = window.AbortController ? new AbortController() : null;
      var timer = controller ? setTimeout(function () { controller.abort(); }, 15000) : null;

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ email: email, source: 'footer', website: honeypot ? honeypot.value : '', page: location.href }),
        signal: controller ? controller.signal : undefined
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            return { status: res.status, data: data };
          });
        })
        .then(function (r) {
          if (r.status === 200 && r.data && r.data.ok) {
            input.value = '';
            input.blur();
            show(MESSAGES[r.data.status] || MESSAGES.confirm, 'success');
          } else if (r.status === 400) {
            show(MESSAGES.invalid, 'error');
          } else if (r.status === 429) {
            show(MESSAGES.limit, 'error');
          } else {
            show(MESSAGES.error, 'error');
          }
        })
        .catch(function () {
          show(MESSAGES.error, 'error');
        })
        .then(function () {
          if (timer) clearTimeout(timer);
          busy = false;
          button.disabled = false;
          form.classList.remove('is-loading');
        });
    });
  }

  function initAll() {
    var forms = document.querySelectorAll('.hz-newsletter__form');
    for (var i = 0; i < forms.length; i++) init(forms[i]);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }
})();
</script>
