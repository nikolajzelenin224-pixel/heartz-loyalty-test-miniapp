<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEARTZ · Лояльность</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- Загрузка -->
  <div id="screen-loading" class="screen">
    <div class="spinner"></div>
  </div>

  <!-- Ввод кода (первый вход, код ещё не привязан) -->
  <div id="screen-code" class="screen hidden">
    <div class="logo">HEARTZ</div>
    <h1>Введите код клиента</h1>
    <p class="muted">Код вида HEARTZ-XXXXXXXX — есть в письме о заказе или в личном кабинете на сайте.</p>
    <input id="code-input" type="text" placeholder="HEARTZ-XXXXXXXX" autocomplete="off" autocapitalize="characters" maxlength="16">
    <button id="code-submit" class="btn-primary">Подтвердить</button>
    <div id="code-error" class="error hidden"></div>
  </div>

  <!-- Основной экран уровня -->
  <div id="screen-level" class="screen hidden">
    <div class="logo">HEARTZ</div>
    <div class="level-card">
      <div class="level-label">Ваш уровень</div>
      <div class="level-badge" id="level-badge">—</div>
      <div class="level-name" id="level-name">—</div>

      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text">—</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-value" id="stat-ltv">—</div>
        <div class="stat-label">Всего покупок</div>
      </div>
    </div>

    <button id="promo-btn" class="btn-primary">Получить промокод</button>
    <div id="promo-result" class="promo-result hidden"></div>

    <button id="reset-btn" class="btn-ghost">Ввести другой код</button>
  </div>

  <!-- Ошибка -->
  <div id="screen-fatal" class="screen hidden">
    <div class="logo">HEARTZ</div>
    <p class="muted" id="fatal-text">Что-то пошло не так.</p>
    <button id="fatal-retry" class="btn-primary">Повторить</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
